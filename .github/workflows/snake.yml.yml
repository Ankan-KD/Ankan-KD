name: Generate contribution snake

on:
  schedule:
    - cron: "0 3 * * *"   # once a day at 03:00 UTC
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Ankan-KD
          outputs: |
            dist/snake.svg?color_snake=e5d9ff&color_dots=0d1117,2d1b4e,5b2ca0,7b2cff,ff7a00
            dist/snake-dark.svg?color_snake=e5d9ff&color_dots=0d1117,2d1b4e,5b2ca0,7b2cff,ff7a00

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
