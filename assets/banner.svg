FULL-STACK DEVELOPER • AI/ML ENGINEER • CLOUD ENTHUSIAST
</text>

<rect x="270" y="170"
width="660"
height="48"
rx="8"
fill="#090613"
stroke="#6d28d9"/>

<text x="600" y="201"
text-anchor="middle"
font-family="monospace"
font-size="17"
